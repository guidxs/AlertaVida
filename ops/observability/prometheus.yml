global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: alertavida-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: ec2-node
    metrics_path: /metrics
    static_configs:
      - targets:
          - node-exporter:9100
