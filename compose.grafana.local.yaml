services:
  grafana:
    image: grafana/grafana:12.2.1
    container_name: alertavida-grafana-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - alertavida_grafana_local_data:/var/lib/grafana
      - ./DevOps-Cloud/ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./DevOps-Cloud/ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 512m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  alertavida_grafana_local_data:
    name: alertavida_grafana_local_data
